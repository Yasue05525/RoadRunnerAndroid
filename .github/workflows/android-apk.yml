name: Build Unity Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'UnityProject/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unity 3D game for Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Unity license secret
        shell: bash
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Missing UNITY_LICENSE secret. Add your Unity license contents in Settings > Secrets and variables > Actions > New repository secret (name: UNITY_LICENSE)."
            exit 1
          fi

      - name: Build actual Unity project (not the old Kotlin prototype)
        uses: game-ci/unity-builder@v4
        with:
          projectPath: UnityProject
          unityVersion: auto
          targetPlatform: Android
          buildMethod: RunnerSceneBuilder.BuildAndroid
          buildsPath: Builds
          buildName: RoadRunner
          androidExportType: androidPackage
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Verify newly generated APK
        shell: bash
        run: |
          APK="UnityProject/Builds/Android/RoadRunner.apk"
          test -s "$APK" || { echo "::error::Unity did not create $APK"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK"
          echo "Size: $SIZE bytes"
          echo "Commit: $GITHUB_SHA"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK is unexpectedly small (<1 MB). Refusing to publish a likely incomplete or wrong APK."
            exit 1
          fi
          sha256sum "$APK"

      - name: Upload fresh Unity APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoadRunner-Unity-Android-${{ github.run_number }}
          path: UnityProject/Builds/Android/RoadRunner.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish fresh APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} — Unity Android
          files: UnityProject/Builds/Android/RoadRunner.apk
          fail_on_unmatched_files: true
